# OpenOCD configuration for USBasp-Pico JTAG/SWD bridge (v1.10)
#
# Use this with the host-side bridge:
#   python3 scripts/usbasp_pico_jtag_bridge.py -p 3335 -s 1000
#
# Then in a separate terminal:
#   openocd -f scripts/usbasp_pico_openocd.cfg -f target/stm32f1x.cfg
#
# The bridge speaks OpenOCD's built-in remote_bitbang protocol over a TCP
# socket on 127.0.0.1:3335, so no OpenOCD source modification is needed.

adapter driver remote_bitbang
remote_bitbang_port 3335
remote_bitbang_host 127.0.0.1

# Default transport; override with `-c "transport select jtag"` if needed.
transport select jtag

# Default adapter speed (the bridge clamps to the firmware's achievable
# range, roughly 5 kHz - 500 kHz for software-clocked TCK).
adapter speed 1000

# Optional resets (asserted via the bridge -> USBASP_PICO_JTAG_RESET).
# nTRST and nSRST are on GP26/GP27; leave unwired if your target doesn't need them.
reset_config trst_and_srst separate
